[project]
name = "oss-license-guide"
version = "0.1.0"
description = "Open Source License Information Assistant backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic-settings>=2.4,<3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "httpx>=0.27,<1.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.6,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oss_license_guide"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
